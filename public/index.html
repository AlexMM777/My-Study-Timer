<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Study Timer</title>

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!-- ICONS -->
  <script src="https://kit.fontawesome.com/65fc47b128.js" crossorigin="anonymous"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="/style.css"/>

  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</head>
<body>
  <!-- Fullscreen muted background (YouTube API mounts player here) -->
  <div class="bg-video">
    <div id="bgPlayerMount"></div>
  </div>

  <section>
    <div class="container">
      <h1 class="medieval-font">My Study Timer</h1>

      <div class="auth">
        <button id="loginSpotify" class="login-btn medieval-font">Login with Spotify</button>
        <p id="spotifyStatus" class="status medieval-font">Not connected</p>
      </div>

      <div class="painel">
        <p id="work">work</p>
        <p id="short">short break</p>
        <p id="long">long break</p>
      </div>

      <div class="timer">
        <div class="circle">
          <div class="time">
            <p id="minutes"></p>
            <p>:</p>
            <p id="seconds"></p>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="prev" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button id="startPause" title="Start/Pause"><i class="fa-solid fa-play"></i></button>
        <button id="next" title="Next"><i class="fa-solid fa-forward-step"></i></button>
        <button id="reset" title="Reset" style="display: none;"><i class="fa-solid fa-arrow-rotate-left"></i></button>
        <button id="settings" title="Settings"><i class="fa-solid fa-cog"></i></button>
      </div>

      <!-- Segmented Jump-to-phase control -->
      <div class="skip-phase segmented">
        <button class="seg" id="jumpWork" aria-label="Jump to Work">Work</button>
        <button class="seg" id="jumpShort" aria-label="Jump to Short break">Short</button>
        <button class="seg" id="jumpLong" aria-label="Jump to Long break">Long</button>
      </div>
    </div>
  </section>

  <!-- Now Playing pill -->
  <div id="nowPlaying" class="now-playing" style="display:none;">
    <span id="npTitle">—</span>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeSettingsBtn">&times;</span>
      <h2>Settings</h2>

      <form id="settingsForm" class="settings-grid">
        <!-- Durations -->
        <div class="field">
          <label for="workDuration">Work (minutes)</label>
          <input type="number" id="workDuration" min="1" value="50">
        </div>
        <div class="field">
          <label for="shortBreakDuration">Short break (minutes)</label>
          <input type="number" id="shortBreakDuration" min="1" value="10">
        </div>
        <div class="field">
          <label for="longBreakDuration">Long break (minutes)</label>
          <input type="number" id="longBreakDuration" min="1" value="20">
        </div>
        <div class="field">
          <label for="cyclesUntilLong">Short breaks before long break</label>
          <input type="number" id="cyclesUntilLong" min="1" value="4">
        </div>

        <!-- Break music behavior -->
        <div class="field">
          <label for="breakMusicBehavior">Break music behavior</label>
          <select id="breakMusicBehavior" class="select">
            <option value="pause">Pause on breaks</option>
            <option value="quiet" selected>Quiet</option>
            <option value="same">Same volume</option>
          </select>
        </div>

        <!-- Show track info toggle -->
        <div class="field">
          <label for="showTrackInfo">Show track info</label>
          <select id="showTrackInfo" class="select">
            <option value="on" selected>On</option>
            <option value="off">Off</option>
          </select>
        </div>

        <!-- Background YouTube links -->
        <div class="field field-span">
          <label for="bgLinks">Background videos (one YouTube link per line)</label>
          <textarea id="bgLinks" rows="6" placeholder="Paste YouTube links here..."></textarea>
          <small>Order matters. Top plays first. Remove lines to delete.</small>
        </div>

        <!-- Custom sound effect URLs -->
        <div class="field field-span">
          <label for="soundWork">Work start sound (URL, optional)</label>
          <input type="url" id="soundWork" placeholder="https://example.com/work_start.mp3">
          <small>Leave blank to use the built-in work_start.wav</small>
        </div>
        <div class="field field-span">
          <label for="soundShort">Short break sound (URL, optional)</label>
          <input type="url" id="soundShort" placeholder="https://example.com/short_break.mp3">
          <small>Leave blank to use the built-in short_break.wav</small>
        </div>
        <div class="field field-span">
          <label for="soundLong">Long break sound (URL, optional)</label>
          <input type="url" id="soundLong" placeholder="https://example.com/long_break.mp3">
          <small>Leave blank to use the built-in long_break.wav</small>
        </div>

        <!-- Save button pinned bottom -->
        <div class="actions">
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- App modules -->
  <script type="module" src="/js/storage.js"></script>
  <script type="module" src="/js/youtube-bg.js"></script>
  <script type="module" src="/js/spotify.js"></script>
  <script type="module" src="/js/timer.js"></script>
  <script type="module" src="/js/ui.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
